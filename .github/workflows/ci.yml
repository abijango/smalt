name: CI

# Every check runs in a Docker container, so a local run of
# scripts/ci/run-local.sh gives the same result. Each job writes a Markdown
# report; the last job posts them as one comment on the PR and edits that
# same comment on every push.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in the desktop container
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$(sh scripts/ci/desktop-image.sh)" \
            bash scripts/ci/desktop-checks.sh --install-deps
      - name: Job summary
        if: always()
        run: cat reports/desktop.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-desktop
          path: |
            reports/desktop.md
            reports/desktop-*.log
            reports/ctest-junit.xml
          if-no-files-found: warn

  kobo:
    name: Kobo package (Qt5, firmware 4.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and check KoboRoot.tgz in the kobuild Qt5 container
        run: scripts/ci/kobo-checks.sh
      - name: Job summary
        if: always()
        run: cat reports/kobo.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-kobo
          path: |
            reports/kobo.md
            reports/kobo-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KoboRoot
          path: |
            out/KoboRoot.tgz
            out/Smalt-qt5.zip
          if-no-files-found: error

  report:
    name: Post report to PR
    if: always() && github.event_name == 'pull_request'
    needs: [desktop, kobo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Combine reports
        run: |
          scripts/ci/combine-reports.sh reports \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.event.pull_request.head.sha }}"
          cat reports/pr-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        # PRs from forks get a read-only token; the job summary still has the report.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/pr-comment.md', 'utf8');
            const marker = '<!-- smalt-ci-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
